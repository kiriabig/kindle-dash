; Настройки дашборда для Kindle 4. После правки картинка пересоберётся сама
; (на GitHub) или командой: python3 dash/build.py

[dashboard]
; weather — погода, photo — фото
mode = weather
; portrait — вертикально 600×800, landscape — горизонтально 800×600
orientation = landscape
; для landscape: 90 — кнопки Kindle слева от экрана, 270 — справа
rotate = 90
; ru или en
language = ru

[weather]
city = Charneca da Caparica
; координаты приблизительные (центр района), для прогноза этого достаточно
latitude = 38.62
longitude = -9.20

[photo]
; имя файла из папки photos/. Пусто — берётся самое свежее фото в папке
file =
; crop — заполнить экран, обрезав края; pad — вписать целиком с белыми полями
fit = crop
; для crop: какую точку кадра держать в центре, X,Y от 0 до 1 (0.5,0.66 — чуть ниже середины)
focus = 0.5,0.5
; контраст, осветление средних тонов (gamma > 1 светлее), резкость
contrast = 1.15
gamma = 1.15
sharpen = yes
